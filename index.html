<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Universo Para Ti</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d021a;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .header-title {
      position: absolute;
      top: 20px;
      z-index: 10;
      font-size: 1.5rem;
      letter-spacing: 2px;
      color: #ff77ab;
      text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
      text-transform: uppercase;
      font-weight: bold;
    }

    .floating-text {
      position: absolute;
      z-index: 5;
      font-size: 0.9rem;
      color: #ffe6f2;
      text-shadow: 0 0 8px #ff007f, 0 0 15px #ffffff;
      pointer-events: none;
      white-space: nowrap;
      animation: float 4s ease-in-out infinite alternate;
    }

    @keyframes float {
      0% { transform: translateY(0px); opacity: 0.8; }
      100% { transform: translateY(-10px); opacity: 1; }
    }

    .main-text {
      position: absolute;
      z-index: 10;
      font-size: 2.2rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 10px #ff3399, 0 0 25px #ff007f, 0 0 40px #ff007f;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header-title">PARA MI AMOR</div>

  <!-- Frases flotantes alrededor del universo -->
  <div class="floating-text" style="top: 25%; left: 15%;">Te adoro</div>
  <div class="floating-text" style="top: 20%; right: 18%;">Amor de mi vida</div>
  <div class="floating-text" style="top: 65%; left: 10%;">Eres única</div>
  <div class="floating-text" style="top: 70%; right: 12%;">Me encantas</div>
  <div class="floating-text" style="top: 45%; right: 8%;">Eres mi universo</div>

  <div class="main-text">Te Amo</div>

  <canvas id="universe"></canvas>

  <script>
    const canvas = document.getElementById('universe');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resize);
    resize();

    // Ecuación para generar coordenadas en forma de corazón
    function getHeartPosition(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x, y };
    }

    class Particle {
      constructor(isHeart = false) {
        this.reset(isHeart);
      }

      reset(isHeart = false) {
        this.isHeart = isHeart;
        if (this.isHeart) {
          const t = Math.random() * Math.PI * 2;
          const pos = getHeartPosition(t);
          const scale = Math.min(width, height) / 40;
          this.targetX = width / 2 + pos.x * scale;
          this.targetY = height / 2 + pos.y * scale;
          
          this.x = width / 2 + (Math.random() - 0.5) * 50;
          this.y = height / 2 + (Math.random() - 0.5) * 50;
          this.size = Math.random() * 2 + 1;
          this.speed = Math.random() * 0.02 + 0.005;
          this.color = `hsl(${Math.random() * 40 + 320}, 100%, 75%)`;
        } else {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.size = Math.random() * 1.5;
          this.speedX = (Math.random() - 0.5) * 0.3;
          this.speedY = (Math.random() - 0.5) * 0.3;
          this.color = `rgba(255, 255, 255, ${Math.random() * 0.8})`;
        }
      }

      update() {
        if (this.isHeart) {
          this.x += (this.targetX - this.x) * this.speed;
          this.y += (this.targetY - this.y) * this.speed;
        } else {
          this.x += this.speedX;
          this.y += this.speedY;

          if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
            this.reset(false);
          }
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = this.isHeart ? 10 : 2;
        ctx.shadowColor = this.isHeart ? '#ff007f' : '#ffffff';
        ctx.fill();
      }
    }

    // Crear partículas para el fondo y para el corazón
    for (let i = 0; i < 600; i++) {
      particles.push(new Particle(true)); // Corazón de estrellas
    }
    for (let i = 0; i < 300; i++) {
      particles.push(new Particle(false)); // Fondo galáctico
    }

    function animate() {
      ctx.fillStyle = 'rgba(13, 2, 26, 0.2)';
      ctx.fillRect(0, 0, width, height);

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
